<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="stageGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="70" y1="39" x2="70" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="frontCardClip">
      <rect x="28" y="45" width="64" height="46" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <!-- Stage (central 96x96, 16px transparent margin) -->
  <rect x="16" y="16" width="96" height="96" rx="22" ry="22" fill="url(#stageGrad)"/>

  <!-- Back card (+8 right, -8 up) -->
  <rect x="36" y="37" width="64" height="46" rx="8" ry="8" fill="#bfdbfe"/>

  <!-- Front card -->
  <rect x="28" y="45" width="64" height="46" rx="8" ry="8" fill="#ffffff"/>

  <!-- Subtle bottom 1/3 band on front card -->
  <rect x="28" y="76" width="64" height="15" fill="#dbeafe" clip-path="url(#frontCardClip)"/>

  <!-- Subtle 1px ribbon-card boundary shadow -->
  <rect x="69" y="45" width="1" height="46" fill="#1d4ed8" fill-opacity="0.25"/>
  <rect x="88" y="45" width="1" height="46" fill="#1d4ed8" fill-opacity="0.25"/>

  <!-- Bookmark ribbon with V-notch at bottom -->
  <path d="M 70 41 Q 70 39 72 39 L 86 39 Q 88 39 88 41 L 88 96 L 79 89 L 70 96 Z" fill="url(#ribbonGrad)"/>

  <!-- Ribbon top fold -->
  <path d="M 70 41 Q 70 39 72 39 L 86 39 Q 88 39 88 41 L 88 43 L 70 43 Z" fill="#c2410c"/>
</svg>
